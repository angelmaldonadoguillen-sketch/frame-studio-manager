<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#131315" />
<title>FRAME — Banco de pruebas de UI</title>

<!-- El mismo arranque de tema que index.html. Sin esto el banco se dibuja
     siempre oscuro aunque la app esté en claro, y deja de servir para lo
     único que existe: mostrar lo mismo que la app.
     Se usa otra clave de localStorage a propósito — probar un tema acá no
     debería cambiarle el tema a FRAME. -->
<script>
  (() => {
    const key = 'frame_theme_preview';
    const normalize = value => value === 'light' ? 'light' : 'dark';
    let initial = 'dark';
    try { initial = normalize(localStorage.getItem(key)); } catch {}

    window.setFrameTheme = value => {
      const theme = normalize(value);
      const root = document.documentElement;
      root.classList.add('theme-switching');
      root.dataset.theme = theme;
      root.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]')
        ?.setAttribute('content', theme === 'light' ? '#f4f4f7' : '#131315');
      void root.offsetHeight;
      const devolverTransiciones = () => root.classList.remove('theme-switching');
      requestAnimationFrame(devolverTransiciones);
      setTimeout(devolverTransiciones, 120);
      try { localStorage.setItem(key, theme); } catch {}
      return theme;
    };
    window.setFrameTheme(initial);
  })();
</script>

<!--
  Banco de pruebas: carga los componentes REALES de FRAME con datos falsos,
  sin autenticación y sin Firestore. Sirve para iterar el diseño de las
  tarjetas y el tablero sin tener que entrar a la app ni tocar datos reales.
  No forma parte de la app: index.html no lo referencia.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />

<script>

    sans:   ['-apple-system','BlinkMacSystemFont','"SF Pro Text"','Inter','system-ui','sans-serif'],

<!-- Stubs: la app espera estos globales al cargar los .jsx -->
<script>
  const _noop = () => {};
  const _chain = () => new Proxy(function(){ return _chain(); }, {
    get: () => _chain(),
    apply: () => _chain(),
  });
  window.db = {
    collection: () => ({
      doc: () => ({
        get: () => Promise.resolve({ exists:false, data:()=>({}) }),
        set: () => Promise.resolve(), update: () => Promise.resolve(),
        delete: () => Promise.resolve(),
        collection: () => window.db.collection(),
        onSnapshot: () => _noop,
      }),
      get: () => Promise.resolve({ empty:true, docs:[] }),
      where: () => window.db.collection(),
      orderBy: () => window.db.collection(),
      limit: () => window.db.collection(),
      onSnapshot: () => _noop,
    }),
    batch: () => ({ set:_noop, update:_noop, delete:_noop, commit:()=>Promise.resolve() }),
  };
  window.storage = { ref: () => ({
    put: () => ({ on:(_e,_p,_err,done)=>done && done(), snapshot:{ ref:{ getDownloadURL:()=>Promise.resolve('') } } }),
    getDownloadURL: () => Promise.resolve(''),
  })};
  window.firebase = { auth: () => ({ currentUser:null, onAuthStateChanged:()=>_noop, signOut:()=>Promise.resolve() }) };
</script>

<!-- Mismo sistema visual que la app. Antes era una copia inline que se
     desactualizaba: el banco mostraba algo distinto de lo que veía el
     usuario, que es justo lo contrario de para lo que existe. -->
<link rel="stylesheet" href="frame.css" />
<style>
  /* Sólo lo propio del banco, que no forma parte de la app. */
  .harness-bar{
    position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:10px;
    /* Sale de la paleta y no de un rgba fijo: con el fondo oscuro escrito a
       mano, la barra quedaba negra sobre el modo claro. */
    padding:10px 18px; background:color-mix(in srgb, var(--surface-2) 80%, transparent);
    backdrop-filter:blur(20px) saturate(180%);
    border-bottom:.5px solid var(--border); font-size:var(--t-11); color:var(--text-muted);
  }
  .harness-bar b{color:var(--text-dim); font-weight:600}
  .harness-sec{padding:22px 18px; max-width:1180px}
  .harness-h{font-size:var(--t-11);font-weight:600;letter-spacing:.05em;text-transform:uppercase;
             color:var(--text-muted);margin:0 0 12px}
  body{overflow:auto}
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

  <!-- Mismo orden que index.html. clients.jsx y team.jsx hacen falta aunque
       no se rendericen directamente: el modal usa ClientAutocomplete y la
       sección de equipo usa Avatar/AVAILABILITY. Sin ellos el modal crashea
       al abrirse — que es exactamente lo que este banco existe para detectar
       antes de subir nada. -->
  <script src="attachment-utils.js"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="modal.jsx"></script>
  <script type="text/babel" src="views.jsx"></script>
  <script type="text/babel" src="clients.jsx"></script>
  <script type="text/babel" src="team.jsx"></script>

  <script type="text/babel">
    // localISO, no toISOString: en UTC-6 este último devuelve mañana
    // a partir de las 18:00 y el banco mostraría fechas corridas un día.
    const iso = (offsetDays) => {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return localISO(d);
    };
    const ck = (n, done) => Array.from({length:n}, (_,i) => ({
      id:'c'+i, text:'Tarea '+(i+1), done: i < done,
    }));

    window.__liveTeam = [
      { id:'u1', name:'Angel Maldonado', initials:'AM', color:'#d4ff4f', status:'active' },
      { id:'u2', name:'Ronal Banegas',   initials:'RB', color:'#ff7a59', status:'active' },
      { id:'u3', name:'Rafael A.',       initials:'RA', color:'#64d2ff', status:'active' },
    ];

    // Se normaliza igual que en la app: los datos entran por normalizeProject
    // en el listener de Firestore. Sin esto el banco miente — probaría contra
    // objetos que en la app real nunca existen.
    const MOCK = [
      { id:'p1', title:'Reel — ID Motos Nacaome', client:'ID Motos', type:'reel',
        status:'editing', priority:'high', assignees:['u1','u2'],
        deadline:iso(-2), sessionDate:iso(-2), budget:8500, currency:'USD',
        tags:['publicidad','nacaome'], checklist:ck(13,8), favorite:true,
        cover:{type:'color',value:'#252527'}, description:[] },
      { id:'p2', title:'Carrusel lanzamiento colección', client:'Tooned HN', type:'campaign',
        status:'editing', priority:'medium', assignees:['u1'],
        deadline:iso(0), sessionDate:iso(0), budget:0, currency:'USD',
        tags:['redes'], checklist:ck(10,9),
        cover:{type:'color',value:'#252527'}, description:[] },
      { id:'p3', title:'Institucional — Clínica Dental Vega', client:'Clínica Vega', type:'corp',
        status:'producing', priority:'high', assignees:['u2','u3'],
        deadline:iso(3), sessionDate:iso(3), budget:14000, currency:'USD',
        tags:['corporativo'], checklist:ck(12,3),
        cover:{type:'color',value:'#252527'}, description:[] },
      { id:'p4', title:'Behind the scenes — sesión julio', client:'Interno', type:'reel',
        status:'briefing', priority:'low', assignees:['u3'],
        deadline:iso(18), sessionDate:iso(18), budget:0, currency:'USD',
        tags:[], checklist:ck(10,1),
        cover:{type:'color',value:'#252527'}, description:[] },
    ];

    // Tarjeta recién creada, sin checklist: es el único estado donde se
    // ofrece la plantilla, así que sin ella no se puede probar ese camino.
    MOCK.push({
      id:'p5', title:'Reel nuevo — sin checklist', client:'', type:'reel',
      status:'briefing', priority:'medium', assignees:[],
      deadline:iso(7), sessionDate:iso(7), budget:0, currency:'USD',
      tags:[], checklist:[],
      cover:{type:'color',value:'#252527'}, description:[],
    });

    const PROJECTS = MOCK.map(normalizeProject);

    const PF = { tipo:true, cliente:true, estado:true, prioridad:true,
                 responsables:true, deadline:true, presupuesto:true, tags:true, progreso:true };

    const Harness = () => {
      const [openId, setOpenId] = React.useState(null);
      // Estado real en vez de onUpdate vacío: sin esto no se puede probar
      // nada que escriba — marcar una tarea, aplicar una plantilla, reordenar
      // el checklist. El banco mostraba la interfaz pero no reaccionaba.
      const [data, setData] = React.useState(PROJECTS);
      const upd = (p) => setData(d => d.map(x => x.id === p.id ? p : x));

      // Ahora que FRAME tiene dos temas, el banco tiene que poder mostrar los
      // dos: un componente puede leerse bien en oscuro y perderse en claro.
      const [tema, setTema] = React.useState(() => document.documentElement.dataset.theme || 'dark');
      const alternarTema = () => setTema(window.setFrameTheme(tema === 'dark' ? 'light' : 'dark'));

      return (
      <div>
        <div className="harness-bar">
          <b>Banco de pruebas</b>
          <span>· componentes reales · datos falsos · sin Firestore</span>
          <button
            onClick={alternarTema}
            style={{ marginLeft: 'auto', padding: '4px 10px', borderRadius: 6,
                     background: 'var(--surface-2)', color: 'var(--text)', fontSize: 12 }}
          >
            {tema === 'dark' ? 'Modo oscuro' : 'Modo claro'}
          </button>
        </div>

        <div className="harness-sec">
          <div className="harness-h">Tarjeta de tarea — los cuatro estados de entrega</div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(268px,1fr))', gap:10 }}>
            {data.map(p => (
              <ProjectCardMini key={p.id} project={p} previewFields={PF}
                onClick={()=>{}} onToggleFavorite={()=>{}}
                onDelete={()=>{}} onDuplicate={()=>{}} />
            ))}
          </div>
        </div>

        <div className="harness-sec">
          <div className="harness-h">Variante compacta</div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(268px,1fr))', gap:10 }}>
            {data.slice(0,2).map(p => (
              <ProjectCardMini key={p.id} project={p} previewFields={PF} compact
                onClick={()=>{}} onToggleFavorite={()=>{}} />
            ))}
          </div>
        </div>

        <div className="harness-sec">
          <div className="harness-h">Modal de tarea — abrir para revisar el detalle</div>
          <button
            onClick={() => setOpenId(data[0].id)}
            className="px-3 py-2 rounded-lg text-[13px] font-semibold"
            style={{ background: 'var(--accent)', color: '#131315' }}
          >
            Abrir tarjeta de ejemplo
          </button>
        </div>

        {openId && (
          <ProjectModal
            key={openId}
            project={data.find(p => p.id === openId)}
            projects={data}
            onNavigate={setOpenId}
            currentUserId="u1"
            team={window.__liveTeam}
            clients={[{ id:'cl1', name:'ID Motos', color:'#64D2FF', initials:'IM' }]}
            onCreateClient={()=>{}}
            onClose={() => setOpenId(null)}
            onUpdate={upd}
            onDelete={()=>{}}
            customTypes={PROJECT_TYPES}
            onCreateCustomType={()=>{}}
            onUpdateCustomType={()=>{}}
            onDeleteCustomType={()=>{}}
          />
        )}

        <div className="harness-sec" style={{ maxWidth: 'none' }}>
          <div className="harness-h">ListView — la vista de tabla</div>
          <div style={{ height: 260, position: 'relative' }}>
            <ListView
              projects={data}
              onOpenProject={setOpenId}
              onDeleteProject={()=>{}}
              onDuplicateProject={()=>{}}
              onToggleFavorite={()=>{}}
            />
          </div>
        </div>

        <div className="harness-sec">
          <div className="harness-h">GalleryCard</div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(230px,1fr))', gap:12 }}>
            {data.slice(0,3).map(p => (
              <GalleryCard key={p.id} project={p} previewFields={PF}
                onClick={()=>{}} onToggleFavorite={()=>{}} />
            ))}
          </div>
        </div>
      </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<Harness />);
  </script>
</body>
