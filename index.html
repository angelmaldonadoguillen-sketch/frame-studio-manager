<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<!-- Los controles nativos siguen el tema activo. El script inmediato evita
     mostrar un frame oscuro antes de que React restaure la preferencia. -->
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#131315" />
<script>
  (() => {
    const key = 'frame_theme';
    const normalize = value => value === 'light' ? 'light' : 'dark';
    let initial = 'dark';
    try { initial = normalize(localStorage.getItem(key)); } catch {}

    window.setFrameTheme = value => {
      const theme = normalize(value);
      // Sin esto, todo lo que transiciona background-color se queda con el
      // color del tema anterior hasta recargar (ver frame.css).
      document.documentElement.classList.add('theme-switching');
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]')
        ?.setAttribute('content', theme === 'light' ? '#f4f4f7' : '#131315');
      // Se fuerza el recálculo antes de devolver las transiciones.
      void document.documentElement.offsetHeight;
      // Con respaldo por temporizador: requestAnimationFrame no se ejecuta
      // mientras la pestaña está oculta, y sin esto las transiciones
      // quedarían apagadas hasta que alguien vuelva a mirarla.
      const devolverTransiciones = () =>
        document.documentElement.classList.remove('theme-switching');
      requestAnimationFrame(devolverTransiciones);
      setTimeout(devolverTransiciones, 120);
      try { localStorage.setItem(key, theme); } catch {}
      return theme;
    };
    window.setFrameTheme(initial);
  })();
</script>
<title>FRAME — Studio Manager</title>

<!-- Instalable como app. Las rutas van relativas porque en GitHub Pages
     FRAME no vive en la raíz del dominio sino en /frame-studio-manager/:
     con "/" el navegador buscaría el manifiesto donde no está. -->
<link rel="manifest" href="manifest.webmanifest" />

<!-- iOS no lee display:standalone del manifiesto; necesita lo suyo. Sin
     esto, agregarla a la pantalla de inicio abre igual con la barra de
     Safari, que es justo lo que se quiere evitar. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<!-- black-translucent: la app se dibuja debajo de la barra de estado. Es lo
     que hace que el fondo llegue hasta arriba del todo en vez de dejar una
     franja. Funciona porque el viewport ya lleva viewport-fit=cover y las
     pantallas usan env(safe-area-inset-*) para no meterse bajo el reloj. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FRAME" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Una sola familia para toda la interfaz. Syne y Space Grotesk son tipografías
     de display: a los 12-13px donde vive casi toda la app perdían definición
     (la g de doble piso, la a geométrica, I/l/1 indistinguibles). Inter se
     diseñó para pantalla y trae cifras tabulares, así que tampoco hace falta
     una monoespaciada aparte. En Mac cae en SF Pro real vía -apple-system. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        // Los tres roles apuntan a la misma familia. Se conservan los nombres
        // porque font-display / font-mono están usados en todo el código; lo
        // que cambia es a qué resuelven. La jerarquía la hacen el peso y el
        // tracking, no familias distintas.
        fontFamily: {
          display: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', 'Inter', 'system-ui', 'sans-serif'],
          sans:    ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', 'Inter', 'system-ui', 'sans-serif'],
          mono:    ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', 'Inter', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>

       cuál de los dos renderiza. -->
  <script type="text/babel" src="mobile.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script>
    // El service worker no cachea nada (ver sw.js): está sólo para que el
    // navegador ofrezca instalar la app. Se registra después de 'load' para
    // no competir por ancho de banda con lo que hace falta para pintar.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          // Que falle no rompe nada: FRAME sigue funcionando en el navegador,
          // sólo deja de ofrecerse el botón de instalar.
          console.warn('[FRAME] Service worker no registrado:', err.message);
        });
      });
    }
  </script>
